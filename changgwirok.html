<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창귀록 倀鬼錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&family=Gothic+A1:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0F1626; --night2:#182034; --line:#2C3651;
  --paper:#E7E1D2; --dim:#8F94A6; --dimmer:#5C6379;
  --ju:#B0392C; --ju-lit:#D9614F;
  --ok:#6E9E92; --lamp:#C9A03C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--night); color:var(--paper);
  font-family:'Nanum Myeongjo',serif; font-size:17px; line-height:1.95;
  display:flex; justify-content:center; min-height:100%;
  -webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
#bleed{
  position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  transition:opacity 1.4s ease;
  background:radial-gradient(ellipse at center,transparent 34%,rgba(176,57,44,.30) 74%,rgba(176,57,44,.62) 100%);
}
#wrap{position:relative;z-index:1;width:100%;max-width:720px;padding:28px 22px 80px;display:flex;flex-direction:column}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-family:'Song Myung',serif;font-weight:400;font-size:23px;letter-spacing:.22em;color:var(--paper)}
h1 small{display:block;font-size:11px;letter-spacing:.5em;color:var(--dimmer);margin-top:5px;font-family:'Gothic A1',sans-serif;font-weight:300}
#when{font-family:'Gothic A1',sans-serif;font-weight:300;font-size:12px;color:var(--dim);text-align:right;letter-spacing:.05em;line-height:1.9;white-space:nowrap}

#gauge{margin:16px 0 6px}
#gauge .row{display:flex;justify-content:space-between;font-family:'Gothic A1',sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--dim);margin-bottom:7px}
#gauge .row b{color:var(--ju-lit);font-weight:500}
#bar{height:2px;background:var(--line);position:relative;overflow:hidden}
#bar i{display:block;height:100%;width:30%;background:var(--ju);transition:width .8s cubic-bezier(.4,0,.2,1)}
#tier{font-family:'Gothic A1',sans-serif;font-size:11px;font-weight:300;color:var(--dimmer);letter-spacing:.1em;margin-top:7px;min-height:16px}

main{flex:1;padding:30px 0 4px}
.p{margin-bottom:19px;animation:fade .7s ease both}
.p.sp{color:var(--dim);font-style:italic}
.p.said{padding-left:16px;border-left:1px solid var(--line)}
.p.mind{padding-left:16px;border-left:1px solid var(--ju);color:var(--ju-lit);font-size:16px}
.p.got{font-family:'Gothic A1',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.1em;color:var(--ok);border:1px solid rgba(110,158,146,.35);padding:9px 13px;display:inline-block;line-height:1.6}
.p.bad{font-family:'Gothic A1',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.1em;color:var(--ju-lit);border:1px solid rgba(176,57,44,.4);padding:9px 13px;display:inline-block;line-height:1.6}
.p.hd{font-family:'Song Myung',serif;font-size:19px;letter-spacing:.16em;color:var(--paper);margin:34px 0 20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

#acts{display:flex;flex-direction:column;gap:9px;padding-top:14px}
button{
  font-family:'Nanum Myeongjo',serif;font-size:16px;color:var(--paper);
  background:transparent;border:1px solid var(--line);padding:13px 17px;
  text-align:left;cursor:pointer;transition:border-color .2s,background .2s,color .2s;line-height:1.6;
}
button:hover:not(:disabled),button:focus-visible{border-color:var(--paper);background:var(--night2);outline:none}
button:disabled{color:var(--dimmer);border-color:#212a40;cursor:default}
button .k{font-family:'Gothic A1',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.16em;color:var(--dimmer);display:block;margin-bottom:3px}
button.warn:hover{border-color:var(--ju);color:var(--ju-lit)}
button.gold .k{color:var(--lamp)}
button.gold:hover{border-color:var(--lamp)}

#clues{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;font-family:'Gothic A1',sans-serif;font-size:12px;font-weight:300;color:var(--dim);letter-spacing:.06em;line-height:2}
#clues h4{font-weight:500;font-size:10.5px;letter-spacing:.2em;color:var(--dimmer);margin-bottom:8px}
#clues .c{color:var(--ok)}
#clues .f{color:var(--lamp)}
@media(max-width:520px){body{font-size:16px}#wrap{padding:20px 16px 60px}h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="stars"></canvas>
<div id="bleed"></div>

<div id="wrap">
  <header>
    <h1>창귀록<small>倀 鬼 錄</small></h1>
    <div id="when"></div>
  </header>
  <div id="gauge">
    <div class="row"><span>무병 巫病</span><b id="mval">30</b></div>
    <div id="bar"><i id="bfill"></i></div>
    <div id="tier"></div>
  </div>
  <main id="main"></main>
  <div id="acts"></div>
  <div id="clues"></div>
</div>

<script>
const S={day:1,acts:2,mu:30,buja:3,clues:new Set(),freed:new Set(),done:new Set(),lost:new Set(),names:new Set(),saw:new Set()};

const CLUE={
  jeung:'제웅과 사주 한 장',
  chang:'창귀 목격담',
  ilji:'서운관 관측 일지',
  jinryo:'활인서 진료부',
  saju:'사주 한 쌍',
  jangbu:'성수청 굿 장부',
  chingching:'참칭의 증거'
};
const GHOST={1:['굴각','물지게꾼 억쇠'],2:['이올','백정의 딸 분이'],3:['육혼','늙은 걸인 최노인']};
const NAMEOF={1:'jinryo',2:'saju',3:'jangbu'};
const BENE={1:'판윤댁 셋째 아들',2:'종친가 규수 이씨',3:'서운관 판사 본인'};

const E=(s)=>document.getElementById(s);
const has=(c)=>S.clues.has(c);
function give(c){S.clues.add(c);}
function mu(n){S.mu=Math.max(0,Math.min(100,S.mu+n));}

function tier(){
  const m=S.mu;
  if(m<40)return '멀쩡하다. 아무것도 보이지 않는다.';
  if(m<60)return '신안이 열렸다. 어둠 속의 것이 보인다.';
  if(m<80)return '남의 속이 들린다. 듣지 않으려 해도 들린다.';
  if(m<100)return '들리는 것에 거짓이 섞인다. 무엇이 참인지 모르겠다.';
  return '임계. 받거나, 죽거나.';
}
function paint(){
  E('mval').textContent=S.mu;
  E('bfill').style.width=S.mu+'%';
  E('tier').textContent=tier();
  E('bleed').style.opacity=Math.max(0,(S.mu-25)/100).toFixed(2);
  E('when').innerHTML=(S.day<4?`섣달 스무이레 +${S.day-1}일`:'섣달 그믐 — 나례')+`<br>남은 발품 ${S.acts} · 부적 ${S.buja}`;
  const cl=[...S.clues].map(c=>`<span class="c">${CLUE[c]}</span>`);
  const fr=[...S.freed].map(g=>`<span class="f">${GHOST[g][0]} 해방</span>`);
  E('clues').innerHTML='<h4>손에 쥔 것</h4>'+([...cl,...fr].join(' · ')||'<span style="color:#4A5169">아직 없다</span>');
}

let queue=[];
function show(nodes,choices){
  const m=E('main');m.innerHTML='';E('acts').innerHTML='';
  nodes.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='p'+(n[0]?' '+n[0]:'');
    d.style.animationDelay=(i*.11)+'s';
    d.innerHTML=n[1];m.appendChild(d);
  });
  (choices||[]).forEach(c=>{
    const b=document.createElement('button');
    if(c.cls)b.className=c.cls;
    b.innerHTML=(c.k?`<span class="k">${c.k}</span>`:'')+c.t;
    if(c.off){b.disabled=true;}else{b.onclick=()=>{c.f();};}
    E('acts').appendChild(b);
  });
  paint();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── 서장 ── */
function intro(){
  show([
    ['hd','서장 — 열아흐레, 청계천 어귀'],
    [null,'짚으로 엮은 사람 하나가 눈밭에 누워 있다. 팔도 다리도 대충 꼬아 만든 것이 어린애 장난 같은데, 어제 이 자리에서 물지게꾼 하나가 사라졌다.'],
    [null,'제웅이다. 정월 대보름에 액을 대신 지고 버려지는 인형.'],
    ['sp','아무도 이 여섯을 찾지 않는다. 물지게꾼, 백정의 딸, 걸인 셋, 그리고 이름도 모르는 아이 하나. 그래서 이 일이 나에게 왔다. 역적의 자식에게 맡길 만한 일이라는 뜻이다.'],
    [null,'배를 갈랐다. 종이 두 장이 나온다. 한 장엔 사라진 자의 사주. 다른 한 장은 —'],
    ['sp','비어 있다. 아니, 비어 있는 것이 아니라 <b>지워져</b> 있다.']
  ],[
    {k:'신안 神眼',t:'눈을 뜬다. 보고 싶지 않은 것까지 본다.',cls:'warn',f:()=>{mu(10);introB(true);}},
    {k:'외면',t:'그냥 관아로 돌아간다.',f:()=>introB(false)}
  ]);
}
function introB(saw){
  const n=[['hd','좌포도청 — 종사관']];
  if(saw){
    n.push([null,'눈을 뜨자 눈밭 위에 발자국이 보인다. 사람의 것이 아니다. 앞발이 뒷발보다 크다.']);
    n.push(['mind','그리고 짚 인형 위에, 아직 마르지 않은 온기가 앉아 있다. 누군가 방금까지 여기 있었다.']);
    give('jeung');
    n.push(['got','손에 넣었다 — 제웅과 사주 한 장']);
  }else{
    n.push([null,'짚 인형을 소매에 넣고 돌아섰다. 아무것도 보지 않았다. 아무것도 보지 않으면 아무것도 앓지 않는다.']);
    give('jeung');
    n.push(['got','손에 넣었다 — 제웅과 사주 한 장']);
  }
  n.push([null,'종사관이 문서를 던진다. 나를 거둬준 사람이다. 이 도성에서 나를 사람 취급하는 유일한 자.']);
  n.push(['said','“나흘이다. 그믐 나례 전에 덮어라. 못 덮으면 네 아비 얘기가 다시 나온다.”']);
  n.push(['sp','나흘. 여덟 번의 발품. 그 안에 여섯을 죽인 자를 찾아야 한다.']);
  show(n,[{k:'수사 개시',t:'나간다.',f:day}]);
}

/* ── 낮 ── */
function day(){
  if(S.acts<=0){night();return;}
  const c=[];
  const A=(id,k,t,fn,cls)=>{
    if(S.done.has(id)||S.lost.has(id))return;
    c.push({k,t,cls,f:fn});
  };
  A('kkokdu','청계천 다리 밑','꼭두쇠를 만난다 — 걸인패 두목',()=>kkokdu());
  if(has('chang')) A('seoun','서운관','겁 많은 관원을 붙든다',()=>seoun());
  if(has('ilji')) A('hwarin','활인서','별제를 만난다 — 빈민을 돌보는 관리',()=>hwarin());
  if(has('jinryo')) A('gyusu','종친가','병약한 규수를 만난다',()=>gyusu());
  if(has('saju')) A('gukmu','성수청','국무당 앞에 선다',()=>gukmu());
  A('dokkaebi','수표교 아래','도깨비와 거래한다 — 참말 하나에 메밀묵 한 그릇',()=>dokkaebi(),'gold');
  c.push({k:'현장',t:'실종 현장을 다시 살핀다.',cls:'warn',f:()=>scene()});
  c.push({k:'휴식',t:'앓아눕는다. 무병이 가라앉는다. (−12)',f:()=>{S.acts--;mu(-12);day();}});
  show([
    ['hd',(S.day<4?`${S.day}일차 — 낮`:'그믐 — 낮')],
    ['sp',`남은 발품 ${S.acts}. 도성은 넓고 나흘은 짧다.`]
  ],c);
}
function scene(){
  S.acts--;mu(12);
  const n=[['hd','실종 현장'],[null,'눈이 또 왔다. 발자국은 지워졌다. 그러나 눈을 뜨면 아직 남아 있다.']];
  if(S.mu>=80){
    n.push(['mind','짚 인형이 고개를 든다. 나를 본다. 웃는다.']);
    n.push(['sp','...아니다. 짚은 고개를 들지 않는다. 내가 잘못 본 것이다. 잘못 본 것이어야 한다.']);
  }else{
    n.push(['mind','앞발이 뒷발보다 크다. 호랑이다. 그런데 호랑이는 사람을 끌고 가지 인형을 놓고 가지 않는다.']);
    n.push(['sp','누군가 호랑이에게 <b>이 사람이오</b> 하고 일러준 것이다.']);
  }
  show(n,[{k:'계속',t:'돌아선다.',f:day}]);
}

/* ── 심문 엔진 ── */
function grill(cfg){
  const opts=[];
  if(S.mu>=60){
    opts.push({k:'신안 神眼',t:'그의 속을 듣는다. (무병 +14)',cls:'warn',f:()=>{
      mu(14);
      const lie=S.mu>=80&&Math.random()<0.5;
      show([['hd',cfg.title],['mind',lie?cfg.false_:cfg.mind],
        lie?['sp','...정말 그렇게 들렸나? 확신이 서지 않는다.']:['sp','틀림없이 들었다.']],
        approaches(cfg));
    }});
  }
  show([['hd',cfg.title],...cfg.open],[...opts,...approaches(cfg)]);
}
function approaches(cfg){
  const a=[];
  a.push({k:'압박',t:cfg.pressText,cls:'warn',f:()=>resolve(cfg,'press')});
  a.push({k:'회유',t:cfg.softText,f:()=>resolve(cfg,'soft')});
  const c=cfg.needClue;
  a.push({k:'물증 제시',t:c?`${CLUE[c]}을(를) 내민다.`:'내밀 것이 없다.',off:!c||!has(c),f:()=>resolve(cfg,'evid')});
  return a;
}
function resolve(cfg,how){
  S.acts--;
  const r=cfg[how];
  const n=[['hd',cfg.title],...r.text];
  if(r.win){
    r.win.forEach(c=>give(c));
    n.push(['got','손에 넣었다 — '+r.win.map(c=>CLUE[c]).join(' · ')]);
    S.done.add(cfg.id);
  }
  if(r.lose){S.lost.add(cfg.id);n.push(['bad','문이 닫혔다 — '+r.lose]);}
  if(r.mu)mu(r.mu);
  show(n,[{k:'계속',t:'물러난다.',f:day}]);
}

/* ── 인물 ── */
function kkokdu(){grill({
  id:'kkokdu',title:'청계천 다리 밑 — 꼭두쇠',
  open:[[null,'거적 위에 앉은 사내가 나를 올려다본다. 눈이 마르다 못해 갈라져 있다.'],
    ['said','“여섯이오. 여섯이 없어졌는데 관에서 온 건 당신이 처음이오.”'],
    ['sp','그는 나를 믿지 않는다. 믿을 이유가 없다.']],
  mind:'저 포교 놈도 결국 덮으러 왔겠지. 억쇠가 돌아온 걸 말하면 나를 미친놈으로 몰아 가둘 테고.',
  false_:'저놈이 여섯을 죽였다. 저놈이다. 저놈을 죽여야 한다.',
  needClue:null,
  press:{text:[['said','“관에서 왔다 이거지. 그럼 잡아가시오.”'],[null,'그는 손목을 내민다. 그리고 그뿐이다. 무엇도 나오지 않았다.'],['sp','이 사내에게 힘은 통하지 않는다. 이미 다 빼앗긴 자다.']],mu:4},
  soft:{text:[[null,'나는 거적 옆에 앉았다. 포교의 옷을 입은 채로, 걸인 옆에.'],
    ['said','“...억쇠가 돌아왔소.”'],
    ['said','“사흘 전 밤에. 물지게를 지고 그대로. 나를 부르더군. 이름을 불렀소.”'],
    ['said','“근데 그놈 발이 눈에 안 닿았소. 눈 위를 걷는데, 자국이 없었소.”'],
    ['sp','죽은 자가 산 자의 이름을 부른다. 창귀다.']],win:['chang']},
  evid:{text:[[null,'내밀 것이 없다.']]}
});}

function seoun(){grill({
  id:'seoun',title:'서운관 — 관원',
  open:[[null,'별을 기록하는 하급 관원. 손이 떨린다. 내가 들어서자 붓을 떨어뜨렸다.'],
    ['said','“저는... 저는 하늘만 봅니다. 땅의 일은 모릅니다.”'],
    ['sp','땅의 일을 모르는 자가 왜 이렇게 떠는가.']],
  mind:'말하면 판사 어른이 안다. 판사 어른이 알면 나도 명부에서 지워진다.',
  false_:'이 자를 죽여야 산다. 붓을 들어라. 붓을 눈에 꽂아라.',
  needClue:'chang',
  press:{text:[['said','“모릅니다! 모른다지 않습니까!”'],
    [null,'그는 뛰쳐나갔다. 그날 밤 서운관 관사가 비었다. 필사본도 함께 사라졌다.'],
    ['sp','부술 수는 있었다. 부수면 도망친다는 걸 몰랐을 뿐이다.']],lose:'서운관 관측 일지는 영영 사라졌다',mu:6},
  soft:{text:[['said','“...당신 이름은 기록에서 빼드리리다.”'],
    [null,'그가 처음으로 나를 본다.'],
    ['said','“삼 년입니다. 삼 년 동안 호환이 열두 번 있었는데, 조정은 한 번도 기록하지 않았습니다.”'],
    ['said','“제가 몰래 베껴 두었습니다. 호환이 있던 밤과, 사람이 사라진 밤이... 같습니다.”'],
    ['sp','호랑이가 데려간 것이다. 그런데 호랑이는 도성에 들지 않는다. 누군가 문을 열어주지 않는 한.']],win:['ilji']},
  evid:{text:[[null,'창귀 목격담을 꺼냈다.'],
    ['said','“죽은 자가 걷는다고요? ...당신도 그걸 보았습니까?”'],

  }
  c.push({k:'거부',t:'끝까지 사람으로 남는다.',f:()=>final('인간 人間',[
    [null,'나는 신을 받지 않았다. 양반의 자식으로, 사람으로 죽었다.'],
    [null,'진실은 모두 밝혀졌다. 서운관 판사는 저잣거리에서 목이 잘렸다.'],
    [null,'그리고 그믐 밤, 산군이 도성에 들었다. 아무것도 멈추지 않았다.'],
    ['sp','옳은 일을 다 했다. 그런데 아무도 살리지 못했다.']
  ])});
  show(n,c);
}

function final(title,body){
  const stat=`무병 ${S.mu} · 해방한 창귀 ${S.freed.size}/3 · 단서 ${S.clues.size}/7 · 잃은 문 ${S.lost.size}`;
  show([['hd','종막 — '+title],...body,
    ['sp','———'],
    ['got',stat]
  ],[{k:'다시',t:'처음부터 다시 한다.',f:()=>{
    S.day=1;S.acts=2;S.mu=30;S.buja=3;
    S.clues=new Set();S.freed=new Set();S.done=new Set();S.lost=new Set();
    intro();
  }}]);
}

})();

intro();
